
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #172554, #2563eb);
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .nav-link {
            color: white !important;
            margin-left: 15px;
        }

        .nav-link:hover {
            color: #bfdbfe !important;
        }

        .main-container {
            margin-top: 35px;
            margin-bottom: 40px;
        }

        .custom-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .page-title {
            color: #172554;
            font-weight: bold;
            margin-bottom: 25px;
        }

        footer {
            background-color: #172554;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'view_students' %}">
            Student Management
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'view_students' %}">
                    Home
                </a>

                <a class="nav-link" href="{% url 'add_student' %}">
                    Add Student
                </a>
            </div>
        </div>

    </div>
</nav>

<div class="container main-container">

    {% block content %}
    {% endblock %}

</div>

<footer>
    Student Management System | Developed using Django
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
