{% extends 'students/base.html' %}

{% block title %}Delete Student{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card custom-card p-5 text-center">

            <div class="mb-3">
                <span class="text-danger">
                    <i class="fs-1">⚠</i>
                </span>
            </div>

            <h2 class="text-danger fw-bold mb-3">
                Delete Student
            </h2>

            <p class="text-muted">
                Are you sure you want to delete this student?
            </p>

            <h5 class="mb-4">{{ student.name }}</h5>

            <form method="POST">
                {% csrf_token %}

                <a href="{% url 'view_students' %}"
                   class="btn btn-outline-secondary me-2">
                    Cancel
                </a>

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
